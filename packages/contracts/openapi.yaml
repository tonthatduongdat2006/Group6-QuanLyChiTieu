        Returns total_income, total_expense and net_change for the month.
        Jar transfers are excluded. net_change = total_income - total_expense.
      parameters:
        - $ref: '#/components/parameters/MonthParam'
      responses:
        '200':
          description: Monthly overview.
          content:
            application/json:
              schema:
                type: object
                required: [data]
