  # ---------------------------------------------------------------------------
  # § 9. AI Chat and Conversations
  # ---------------------------------------------------------------------------

  /ai/conversations:
    post:
      operationId: createConversation
      tags: [AIChat]
      summary: Create an AI conversation
      description: >
        Creates a new conversation. `is_saved` defaults to false.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: ['string', 'null']
                  example: 'Chi tiêu tháng 11'
      responses:
        '201':
          description: Conversation created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AIConversation'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      operationId: listSavedConversations
      tags: [AIChat]
      summary: List saved conversations
      description: Returns only saved conversations (is_saved = true) for the user.
      responses:
        '200':
          description: Saved conversation list.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AIConversation'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /ai/conversations/{conversationId}:
    get:
      operationId: getConversation
      tags: [AIChat]
      summary: Get conversation metadata
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Conversation metadata.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AIConversation'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      operationId: updateConversation
      tags: [AIChat]
      summary: Update conversation (save state)
      description: >
        Sets `is_saved` and records `saved_at`. Saving retains messages and
        pending drafts for later restoration.
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_saved]
              properties:
                is_saved:
                  type: boolean
      responses:
        '200':
          description: Conversation updated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AIConversation'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      operationId: deleteConversation
      tags: [AIChat]
      summary: Delete a conversation
      description: >
        Deletes conversation messages and unconfirmed drafts/batches atomically.
        Confirmed financial transactions must remain intact; financial aggregates
        must not change. FK actions are configured to prevent cascade-deletion
        into confirmed transaction rows.
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '204':
          description: Conversation deleted.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /ai/conversations/{conversationId}/messages:
    post:
      operationId: sendMessage
      tags: [AIChat]
      summary: Send a user message and receive AI drafts
      description: |
        Sends a user message to the conversation. The backend:
        1. Validates ownership and applies request limits (OQ-04).
        2. Assembles context including permitted financial/category data.
        3. Calls the AI provider.
        4. Validates and treats model output as untrusted data.
        5. Saves user and assistant messages.
        6. Creates a draft batch and individual drafts (never transactions).

        AI never creates or confirms transactions automatically.

        **Idempotency:** `Idempotency-Key` is required. The key is stored with
        the user message and resulting draft batch so a network retry does not
        create duplicate messages, AI calls or draft batches.
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  example: 'Hôm nay tôi ăn phở 45 nghìn, uống cà phê 30 nghìn'
      responses:
        '200':
          description: >
            Message processed. Returns the user message, assistant message
            and draft batch with draft IDs and statuses.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [user_message, assistant_message, draft_batch]
                    properties:
                      user_message:
                        $ref: '#/components/schemas/AIMessage'
                      assistant_message:
                        $ref: '#/components/schemas/AIMessage'
                      draft_batch:
                        $ref: '#/components/schemas/AIDraftBatch'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/IdempotencyConflictError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/AIProviderError'

    get:
      operationId: listMessages
      tags: [AIChat]
      summary: List conversation messages
      description: Returns messages ordered by created_at ascending.
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Message list.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AIMessage'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /ai/conversations/{conversationId}/draft-batches:
    get:
      operationId: listConversationDraftBatches
      tags: [AIChat]
      summary: List draft batches for a conversation
      description: >
        Returns batches and drafts required to restore a saved conversation,
        including pending draft state.
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Draft batch list.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AIDraftBatch'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /ai/drafts/{draftId}:
    get:
      operationId: getDraft
      tags: [AIChat]
      summary: Get draft and validation state
      description: Returns a draft only if owned by the authenticated user.
      parameters:
        - $ref: '#/components/parameters/DraftId'
      responses:
        '200':
          description: Draft detail.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AIDraft'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      operationId: updateDraft
      tags: [AIChat]
      summary: Edit draft fields
      description: >
        Updates allowed draft fields: `transaction_type`, `amount`,
        `category_id`, `transaction_date`, `note`, `merchant_name`.
        Status is revalidated after every edit and updated to NEEDS_INPUT or
        READY. Draft edits do not alter financial aggregates.
      parameters:
        - $ref: '#/components/parameters/DraftId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                transaction_type:
                  $ref: '#/components/schemas/TransactionType'
                amount:
                  $ref: '#/components/schemas/MoneyString'
                category_id:
                  type: ['string', 'null']
                  format: uuid
                transaction_date:
                  $ref: '#/components/schemas/DateString'
                note:
                  type: ['string', 'null']
                merchant_name:
                  type: ['string', 'null']
      responses:
        '200':
          description: Draft updated with revalidated status.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AIDraft'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /ai/drafts/{draftId}/cancel:
    post:
      operationId: cancelDraft
      tags: [AIChat]
      summary: Cancel a pending draft
      description: >
        Sets a pending draft to CANCELLED status. Cannot cancel a confirmed
        draft through this endpoint.
      parameters:
        - $ref: '#/components/parameters/DraftId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Draft cancelled.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AIDraft'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          description: Draft is not in a cancellable state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /ai/drafts/{draftId}/confirm:
    post:
      operationId: confirmDraft
      tags: [AIChat]
      summary: Confirm one AI draft and create a transaction
      description: |
        Confirms a single READY draft:
        1. Re-checks ownership and status.
        2. Acquires the shared per-user balance lock.
        3. Computes projected available balance.
        4. Creates the transaction (and receipt rows for AI_SCAN drafts)
           only if balance remains non-negative.
        5. Updates draft status to CONFIRMED with transaction_id atomically.

        Returns 422 INSUFFICIENT_BALANCE and retains the pending draft without
        any financial record if funds are insufficient.

        For AI_SCAN receipt drafts: receipt_details and receipt_items are
        created in the same DB transaction; item sum must equal transaction
        amount.

        **Idempotency:** `Idempotency-Key` is required. Same key returns the
        original confirmation result without duplicating the transaction.
      parameters:
        - $ref: '#/components/parameters/DraftId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Draft confirmed and transaction created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [draft, transaction]
                    properties:
                      draft:
                        $ref: '#/components/schemas/AIDraft'
                      transaction:
                        $ref: '#/components/schemas/TransactionDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/IdempotencyConflictError'
        '422':
          description: Draft not ready, receipt mismatch, or insufficient balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /ai/draft-batches/{batchId}/confirm-all:
    post:
      operationId: confirmAllDrafts
      tags: [AIChat]
      summary: Confirm all pending drafts in a batch (atomic)
      description: |
        Atomically confirms every pending READY draft in the batch:
        1. Acquires the shared per-user balance lock and locks pending drafts.
        2. Validates ALL pending drafts before writing.
        3. If any pending draft is invalid or incomplete, creates NO
           transactions and returns 422 BATCH_INVALID with per-draft reasons.
        4. Computes combined projected available balance for all pending drafts.
        5. If the combined balance would be negative, creates NO transactions
           and returns 422 INSUFFICIENT_BALANCE.
        6. If all drafts are valid and balance is sufficient, creates all
           transactions and updates draft statuses in one DB transaction.

        Previously confirmed or cancelled drafts are not recreated.
        Expired drafts are not confirmable.

        Users may still confirm valid individual drafts subject to the balance
        invariant after a failed confirm-all.

        **Idempotency:** `Idempotency-Key` is required.
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: All pending drafts confirmed.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [drafts, transactions]
                    properties:
                      drafts:
                        type: array
                        items:
                          $ref: '#/components/schemas/AIDraft'
                      transactions:
                        type: array
                        items:
                          $ref: '#/components/schemas/TransactionDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/IdempotencyConflictError'
        '422':
          description: >
            One or more pending drafts are invalid (BATCH_INVALID) or combined
            balance would be negative (INSUFFICIENT_BALANCE). No transactions
            created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------------------
  # § 10. AI Scan / Receipt
  # ---------------------------------------------------------------------------

  /ai/receipts/scan:
    post:
      operationId: scanReceipt
      tags: [AIScan]
      summary: Scan a receipt image and create a draft
      description: |
        Accepts a receipt image, calls Claude Vision via the AI Provider,
        normalizes results, creates one AI_SCAN draft batch and one draft with
        child ai_draft_items.

        **Privacy:** image bytes are NEVER stored. Backend discards temporary
        image data after success, failure or cancellation. No image URL or
        permanent file key is written to the database or logs.

        **Idempotency:** `Idempotency-Key` is required. Same key + same image
        fingerprint (SHA-256) returns the original scan result. Same key +
        different image returns 409 IDEMPOTENCY_KEY_REUSED. The fingerprint
        is computed in-memory and stored as 64 hex characters; image bytes
        are discarded after processing.

        AI does not choose a category; the user must select one before
        confirmation. Unreadable fields (merchant_name, item amounts) are null.
        Item sum must equal invoice total before confirmation is possible.

        Content type must be `multipart/form-data`; accepted image formats and
        size bound are configurable (OQ-08).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: >
                    Receipt image file. Accepted formats and size bound are
                    configurable server-side (OQ-08). Backend verifies actual
                    file signature and decodeability.
      responses:
        '200':
          description: Receipt scanned and draft created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [draft_batch, draft]
                    properties:
                      draft_batch:
                        type: object
                        required: [id, source_type]
                        properties:
                          id:
                            $ref: '#/components/schemas/UUIDString'
                          source_type:
                            type: string
                            enum: [AI_SCAN]
                      draft:
                        $ref: '#/components/schemas/AIDraft'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/IdempotencyConflictError'
        '422':
          description: Invalid image (format, size, undecodeable) or validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimitedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/AIProviderError'

  /ai/drafts/{draftId}/items:
    post:
      operationId: addDraftItem
      tags: [AIScan]
      summary: Add an item to a receipt draft
      description: >
        Adds a draft item to a pending AI_SCAN draft. Backend recomputes
        validation after the change.
      parameters:
        - $ref: '#/components/parameters/DraftId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_name, amount]
              properties:
                item_name:
                  type: string
                  minLength: 1
                  example: 'Bánh mì'
                amount:
                  $ref: '#/components/schemas/MoneyString'
      responses:
        '201':
          description: Draft item added.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AIDraftItem'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /ai/draft-items/{itemId}:
    patch:
      operationId: updateDraftItem
      tags: [AIScan]
      summary: Edit a receipt draft item
      description: >
        Updates `item_name` and/or `amount`. Item must belong to a draft owned
        by the authenticated user. Backend recomputes validation after the
        change.
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                item_name:
                  type: string
                  minLength: 1
                amount:
                  $ref: '#/components/schemas/MoneyString'
      responses:
        '200':
          description: Item updated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AIDraftItem'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      operationId: deleteDraftItem
      tags: [AIScan]
      summary: Delete a receipt draft item
      description: >
        Deletes an item from a pending receipt draft. Backend recomputes
        validation after deletion.
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '204':
          description: Item deleted.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

# ---------------------------------------------------------------------------
# Tags (documentation grouping)
# ---------------------------------------------------------------------------
tags:
  - name: Auth
    description: Authentication, token management and session control.
  - name: Users
    description: Authenticated user profile.
  - name: Dashboard
    description: Aggregated financial summary for the home screen.
  - name: Categories
    description: Income and expense categories.
  - name: Transactions
    description: Manual and AI-confirmed financial transactions.
  - name: Budgets
    description: Monthly spending budgets per category.
  - name: SavingJars
    description: >
      Savings jars with deposit and withdrawal transfers.
      No PATCH or DELETE endpoint (D-11).
  - name: Statistics
    description: >
      Financial statistics and charts. Seven-day expense chart only (D-10).
  - name: AIChat
    description: AI conversation, message, draft and batch endpoints.
  - name: AIScan
    description: Receipt image scanning and draft item management.
